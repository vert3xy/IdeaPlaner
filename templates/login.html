<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - IdPN</title>
    
    <!-- В FastAPI/Python проектах пути обычно начинаются со слеша /static -->
    <link rel="stylesheet" href="/static/css/style.css">
    
    <!-- Tailwind должен быть ПЕРЕД нашими стилями, чтобы мы могли его перебивать -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page-body">

    <div class="auth-container" id="authContainer">
    
        <!-- Форма Регистрации (по умолчанию скрыта слева) -->
        <div class="form-container sign-up-container">
        <form id="registerForm" class="auth-form relative">
            <h1 class="text-4xl font-black tracking-tight mb-2">Создать аккаунт</h1>
            <p class="text-slate-400 text-sm mb-6">Начните свой путь с IdPN</p>

            <div id="regError" class="auth-error-message hidden"></div>

            <div class="w-full space-y-3">
                <input type="text" id="reg_username" class="auth-input" placeholder="Логин">
                <input type="email" id="reg_email" class="auth-input" placeholder="Email">
                
                <div class="relative group">
                    <input type="password" id="reg_password" class="auth-input" placeholder="Пароль">
                    
                    <!-- Подсказка пароля теперь "левитирует" рядом -->
                    <div id="passwordRequirements" class="password-checklist hidden">
                        <span class="checklist-title">Пароль должен содержать:</span>
                        <div id="req_length" class="req-item">8+ символов</div>
                        <div id="req_upper" class="req-item">Заглавная буква</div>
                        <div id="req_digit" class="req-item">Цифра</div>
                        <div id="req_special" class="req-item">Спецсимвол</div>
                    </div>
                </div>
            </div>

            <button type="submit" class="auth-btn-primary w-full mt-8">Создать аккаунт</button>
            
            <div class="mt-6 flex items-center gap-4 text-slate-300">
                <div class="h-px bg-slate-100 flex-1"></div>
                <span class="text-[10px] font-bold">ИЛИ</span>
                <div class="h-px bg-slate-100 flex-1"></div>
            </div>
            
            <div class="social-links mt-4">
                <a href="#" class="hover:scale-110"><i class="fab fa-google"></i></a>
                <a href="#" class="hover:scale-110"><i class="fab fa-github"></i></a>
            </div>
        </form>
    </div>

        <!-- Форма Входа (по умолчанию видна) -->
        <div class="form-container sign-in-container">
            <form id="loginForm" class="auth-form">
                <h1 class="text-3xl font-black mb-2">Вход</h1>
                <div id="loginError" class="auth-error-message hidden"></div>
                <div class="social-links">
                    <a href="#"><i class="fab fa-google"></i></a>
                    <a href="#"><i class="fab fa-github"></i></a>
                </div>
                <input type="text" id="username" class="auth-input" placeholder="Логин" required />
                <input type="password" id="password" class="auth-input" placeholder="Пароль" required />
                <button type="submit" class="auth-btn-primary">Войти</button>
            </form>
        </div>

        <!-- Оверлей (Правая часть) -->
        <div class="overlay-container">
            <div class="overlay">
                <!-- Эту панель мы увидим, когда переключимся на регистрацию -->
                <div class="overlay-panel overlay-left">
                    <h2 class="text-3xl font-black mb-4">Уже с нами?</h2>
                    <p class="mb-8 opacity-90 text-sm">Просто войди в свой аккаунт</p>
                    <button class="auth-btn-ghost" id="signInBtn">Войти</button>
                </div>
                <!-- Эту панель мы видим сейчас -->
                <div class="overlay-panel overlay-right">
                    <h2 class="text-3xl font-black mb-4">Привет!</h2>
                    <p class="mb-8 opacity-90 text-sm">Введи свои данные и начни планировать идеи</p>
                    <button class="auth-btn-ghost" id="signUpBtn">Регистрация</button>
                </div>
            </div>
        </div>
    </div>

    <script src="static/js/auth.js"></script>
</body>
</html>
